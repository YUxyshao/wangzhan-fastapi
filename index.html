<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>title</title>
</head>
<body>
    <h1>网页链接下载</h1>
    <input type="text" id="url" placeholder="请输入网页链接">
    <button onclick="download()">下载</button>
    <script>
        function download() {
            let url = document.getElementById("url").value;
            fetch("/api/download", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    url: url
                })
            })
        }

    </script>
</body>
</html>
