<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>title</title>
</head>
<link rel="stylesheet" type="text/css" href="/static/index.css">
<body>
    <h1>网页链接下载</h1>
    <input type="text" id="url" placeholder="请输入网页链接">
    <button onclick="download()">下载</button>
    <h1 id="return"></h1>
    <script>
     function download() {
    let url = document.getElementById("url").value;
    fetch("/api/download/img", {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            url: url
        })
    })
    .then(response=>response.json())
    .then(data=>{

        if(data.imgs == "none"){
            document.getElementById('return').textContent = data.message;
            return;
        }else if(data.message == "错误"){
            document.getElementById('return').textContent = data.message;
            return;
        }
        else{
        document.getElementById('return').textContent = data.message;
        fetch("/api/fetch/img", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                imgurl_list: data.imgs
            })
        })
        .then(response=>response.blob())
        .then(data=>{
            let url = URL.createObjectURL(data);
            let a = document.createElement('a');
            a.href = url;
            a.download = 'image.zip';
            a.click();
        })
        }
    })
}
    </script>
</body>
</html>
